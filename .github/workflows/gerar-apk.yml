name: Gerar APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: unzip AgendaPlanilha_Android.zip -d projeto

      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Preparar ferramentas Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
        
      - name: Compilar aplicativo
        working-directory: projeto/AgendaPlanilha
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaPlanilha-APK
          path: projeto/AgendaPlanilha/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
